<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>キャンプ ダッシュボード</title>
    <style>
      .viz-root {
        color-scheme: light;
        --surface-1: #f1f5f9;
        --surface-2: #ffffff;
        --text-primary: #0b0b0b;
        --text-secondary: #52514e;
        --border: #e3e1db;
        --series-1: #2a78d6;
        --series-2: #eb6834;
        --series-3: #1baf7a;
        --series-4: #eda100;
        --series-5: #e87ba4;
        --series-6: #008300;
        --series-7: #4a3aa7;
        --series-8: #e34948;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--surface-1);
        color: var(--text-primary);
        font-family: -apple-system, system-ui, "Hiragino Sans", sans-serif;
      }
      #topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: linear-gradient(180deg, #064e3b, #0f172a);
        color: #fff;
        padding: calc(14px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) 16px calc(18px + env(safe-area-inset-left, 0px));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      #topbar h1 { font-size: 19px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
      #topbar .stats { font-size: 13px; color: #cbd5e1; }
      #back {
        flex: none;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        touch-action: manipulation;
        white-space: nowrap;
      }
      #root { max-width: 640px; margin: 0 auto; padding: 16px calc(14px + env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px)); }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
      .tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
      .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
      .tile .value { font-size: 20px; font-weight: 700; }
      .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
      .card h2 { font-size: 14px; margin: 0 0 10px; }
      .card .chart-wrap { position: relative; height: 220px; }
      table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      table.data-table th, table.data-table td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); }
      table.data-table th:first-child, table.data-table td:first-child { text-align: left; }
      table.data-table thead th { color: var(--text-secondary); font-weight: 600; }
      .err { color: #d03b3b; padding: 16px; }
    </style>
  </head>
  <body class="viz-root">
    <div id="topbar">
      <div>
        <h1>📊 ダッシュボード</h1>
        <div class="stats" id="status">読み込み中…</div>
      </div>
      <a id="back" href="./index.html">一覧に戻る</a>
    </div>
    <div id="root">
      <div class="tiles" id="tiles"></div>
      <div class="card">
        <h2>年別 キャンプ回数・泊数</h2>
        <div class="chart-wrap"><canvas id="chartYearCounts"></canvas></div>
      </div>
      <div class="card">
        <h2>年別 費用(円)</h2>
        <div class="chart-wrap"><canvas id="chartYearCost"></canvas></div>
      </div>
      <div class="card">
        <h2>スタイル別 割合</h2>
        <div class="chart-wrap"><canvas id="chartSiteType"></canvas></div>
      </div>
      <div class="card">
        <h2>費目別 内訳(上位)</h2>
        <div class="chart-wrap"><canvas id="chartCostItems"></canvas></div>
      </div>
      <div class="card">
        <h2>年別サマリー(表)</h2>
        <table class="data-table" id="yearTable">
          <thead><tr><th>年</th><th>回数</th><th>泊数</th><th>費用(円)</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="./detail.js"></script>
    <script>
      const SERIES = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"];
      const SITE_TYPES = ["オートキャンプ", "ソロキャンプ", "バイクキャンプ", "グランピング", "車中泊", "その他"];

      function statusEl() { return document.getElementById("status"); }

      function nights(it) {
        if (!it.startDate || !it.endDate) return 0;
        const s = new Date(it.startDate);
        const e = new Date(it.endDate);
        const d = Math.round((e - s) / 86400000);
        return Math.max(d, 0);
      }

      function yearOf(it) { return (it.startDate || "").slice(0, 4) || "不明"; }

      function aggregate(items) {
        const byYear = new Map();
        const bySite = new Map();
        const byCostItem = new Map();
        let totalCost = 0, ratingSum = 0, ratingN = 0, wantYes = 0, wantN = 0;

        for (const it of items) {
          const y = yearOf(it);
          const n = nights(it) || 1;
          const cost = (it.costs || []).reduce((a, r) => a + (Number(r.amount) || 0), 0);
          if (!byYear.has(y)) byYear.set(y, { count: 0, nights: 0, cost: 0 });
          const yEntry = byYear.get(y);
          yEntry.count += 1;
          yEntry.nights += n;
          yEntry.cost += cost;
          totalCost += cost;

          const st = it.siteType || "その他";
          bySite.set(st, (bySite.get(st) || 0) + 1);

          for (const row of it.costs || []) {
            const item = (row.item || "その他").trim() || "その他";
            byCostItem.set(item, (byCostItem.get(item) || 0) + (Number(row.amount) || 0));
          }

          if (typeof it.rating === "number") { ratingSum += it.rating; ratingN += 1; }
          if (typeof it.wantToReturn === "boolean") { wantN += 1; if (it.wantToReturn) wantYes += 1; }
        }

        const years = [...byYear.keys()].sort();
        const totalNights = years.reduce((a, y) => a + byYear.get(y).nights, 0);

        return {
          years, byYear, bySite, byCostItem,
          totals: {
            trips: items.length,
            nights: totalNights,
            cost: totalCost,
            avgRating: ratingN ? (ratingSum / ratingN).toFixed(1) : "—",
            wantRate: wantN ? Math.round((wantYes / wantN) * 100) + "%" : "—",
          },
        };
      }

      function renderTiles(agg) {
        const tiles = [
          { label: "総キャンプ回数", value: agg.totals.trips + " 回" },
          { label: "総泊数", value: agg.totals.nights + " 泊" },
          { label: "総費用", value: "¥" + agg.totals.cost.toLocaleString() },
          { label: "平均満足度", value: agg.totals.avgRating + (agg.totals.avgRating !== "—" ? " / 5" : "") },
          { label: "また行きたい率", value: agg.totals.wantRate },
        ];
        document.getElementById("tiles").innerHTML = tiles
          .map((t) => '<div class="tile"><div class="label">' + t.label + '</div><div class="value">' + t.value + "</div></div>")
          .join("");
      }

      function renderYearTable(agg) {
        const body = agg.years
          .map((y) => {
            const e = agg.byYear.get(y);
            return "<tr><td>" + y + "</td><td>" + e.count + "</td><td>" + e.nights + "</td><td>" + e.cost.toLocaleString() + "</td></tr>";
          })
          .join("");
        document.querySelector("#yearTable tbody").innerHTML = body || '<tr><td colspan="4">データなし</td></tr>';
      }

      function renderCharts(agg) {
        Chart.defaults.color = "#52514e";
        Chart.defaults.borderColor = "#e3e1db";
        Chart.defaults.font.family = "-apple-system, system-ui, 'Hiragino Sans', sans-serif";

        new Chart(document.getElementById("chartYearCounts"), {
          type: "bar",
          data: {
            labels: agg.years,
            datasets: [
              { label: "回数", data: agg.years.map((y) => agg.byYear.get(y).count), backgroundColor: SERIES[0], borderRadius: 4, maxBarThickness: 28 },
              { label: "泊数", data: agg.years.map((y) => agg.byYear.get(y).nights), backgroundColor: SERIES[1], borderRadius: 4, maxBarThickness: 28 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: true } },
            scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });

        new Chart(document.getElementById("chartYearCost"), {
          type: "bar",
          data: { labels: agg.years, datasets: [{ label: "費用(円)", data: agg.years.map((y) => agg.byYear.get(y).cost), backgroundColor: SERIES[0], borderRadius: 4, maxBarThickness: 36 }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { callback: (v) => "¥" + Number(v).toLocaleString() } } },
          },
        });

        const siteLabels = SITE_TYPES.filter((s) => agg.bySite.has(s)).concat([...agg.bySite.keys()].filter((k) => !SITE_TYPES.includes(k)));
        new Chart(document.getElementById("chartSiteType"), {
          type: "doughnut",
          data: { labels: siteLabels, datasets: [{ data: siteLabels.map((s) => agg.bySite.get(s) || 0), backgroundColor: siteLabels.map((_, i) => SERIES[i % SERIES.length]), borderColor: "#f1f5f9", borderWidth: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: "right", labels: { boxWidth: 12 } } } },
        });

        const sortedCosts = [...agg.byCostItem.entries()].sort((a, b) => b[1] - a[1]);
        const top = sortedCosts.slice(0, 6);
        const restSum = sortedCosts.slice(6).reduce((a, [, v]) => a + v, 0);
        if (restSum > 0) top.push(["その他", restSum]);
        new Chart(document.getElementById("chartCostItems"), {
          type: "bar",
          data: { labels: top.map(([k]) => k), datasets: [{ label: "費用(円)", data: top.map(([, v]) => v), backgroundColor: top.map((_, i) => SERIES[i % SERIES.length]), borderRadius: 4 }] },
          options: {
            indexAxis: "y", responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { beginAtZero: true, ticks: { callback: (v) => "¥" + Number(v).toLocaleString() } }, y: { grid: { display: false } } },
          },
        });
      }

      async function main() {
        const items = await window.loadCampVisits();
        const agg = aggregate(items);
        renderTiles(agg);
        renderYearTable(agg);
        renderCharts(agg);
        statusEl().textContent = items.length + " 件の記録 / " + agg.years.length + " 年分";
      }

      main().catch((e) => {
        document.body.innerHTML = '<div class="err">読み込みに失敗しました: ' + (e && e.message ? e.message : e) + "</div>";
      });
    </script>
  </body>
</html>
